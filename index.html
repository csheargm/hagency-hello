<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greetings in the six UN official languages</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
    ul { list-style: none; padding: 0; display: grid; gap: 1rem; }
    li { border: 1px solid #ccc; border-radius: 0.5rem; padding: 1rem; }
    .label { display: block; font-size: 0.9rem; color: #555; }
    .greeting { display: block; font-size: 2rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>Hello, world — in the six UN official languages</h1>
  <ul>
    <li><span class="label">Arabic</span><span class="greeting" lang="ar" dir="rtl">مرحبا</span></li>
    <li><span class="label">Chinese</span><span class="greeting" lang="zh" dir="ltr">你好</span></li>
    <li><span class="label">English</span><span class="greeting" lang="en" dir="ltr">Hello</span></li>
    <li><span class="label">French</span><span class="greeting" lang="fr" dir="ltr">Bonjour</span></li>
    <li><span class="label">Russian</span><span class="greeting" lang="ru" dir="ltr">Здравствуйте</span></li>
    <li><span class="label">Spanish</span><span class="greeting" lang="es" dir="ltr">Hola</span></li>
  </ul>
</body>
</html>
